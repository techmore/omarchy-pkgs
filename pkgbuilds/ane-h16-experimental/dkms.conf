# ane-h16-experimental: DKMS build of ane_h16.ko, the experimental H16 (M4,
# T8132) ANE bring-up module from joshuaswarren/omarchy-ane ane/h16, with the
# two patches in the recipe. DKMS builds it for every installed kernel that has
# headers; nothing loads it. The module has no MODULE_DEVICE_TABLE and the
# package blacklists it besides, so only "ane-h16-experimental load" or an
# explicit modprobe/insmod runs it, and its probe also refuses without
# optin=t8132.
PACKAGE_NAME="ane-h16-experimental"
PACKAGE_VERSION="@PKGVER@"
# DKMS passes KERNELRELEASE, which sends the Makefile down its kbuild branch.
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
BUILT_MODULE_NAME[0]="ane_h16"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
# Apple Silicon kernels only. A kernel without .config builds anyway.
BUILD_EXCLUSIVE_ARCH="aarch64"
BUILD_EXCLUSIVE_CONFIG="CONFIG_ARCH_APPLE"
