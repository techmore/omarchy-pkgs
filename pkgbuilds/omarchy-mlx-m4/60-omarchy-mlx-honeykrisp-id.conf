<?xml version="1.0"?>
<!--
  aurora-silicon/mesa reports VK_DRIVER_ID_AURORA_BOREALIS, which omarchy-mlx
  0.7.28 does not recognise as an Apple GPU driver: it refuses the M4 GPU.
  Report the Honeykrisp driver ID to omarchy-mlx's Vulkan instance only
  (engine "mlx-omarchy"); every other program keeps the Borealis ID.
-->
<driconf>
    <device driver="hk">
        <engine engine_name_match="^mlx-omarchy$">
            <option name="hk_report_honeykrisp_driver_id" value="true" />
        </engine>
    </device>
</driconf>
